model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-sonnet-4-20250514
    litellm_params:
      model: claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
  # DeepSeek V4 (litellm 1.88.1 has no built-in pricing for these, so we supply
  # it here — required for spend tracking / budgets to compute correctly).
  # Rates are USD per token (DeepSeek lists per-1M, divided by 1e6). 1M context,
  # 384K max output. Both support thinking / non-thinking modes.
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.00000014 # $0.14 / 1M (cache miss)
      output_cost_per_token: 0.00000028 # $0.28 / 1M
      cache_read_input_token_cost: 0.0000000028 # $0.0028 / 1M (cache hit)
    model_info:
      max_input_tokens: 1000000
      max_output_tokens: 384000
  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.000000435 # $0.435 / 1M (cache miss)
      output_cost_per_token: 0.00000087 # $0.87 / 1M
      cache_read_input_token_cost: 0.000000003625 # $0.003625 / 1M (cache hit)
    model_info:
      max_input_tokens: 1000000
      max_output_tokens: 384000

  # GitHub Copilot chat models (auth handled by litellm's GitHub Copilot
  # device-flow authenticator; no API key needed here).
  #
  # Pricing: litellm has no built-in rates for github_copilot/* (all null), so we
  # supply GitHub's credit-based per-token prices (1 AI credit = $0.01; rates are
  # USD per 1M from docs.github.com "models-and-pricing", divided by 1e6).
  # GPT-5.4/5.5 use the Default tier; the Long-context tier (above ~128K input)
  # bills higher but litellm can only encode one flat rate per entry.
  # Anthropic rows include cache-write pricing (cache_creation_input_token_cost).
  # Model IDs + context/output limits verified live via ./litellm/verify-copilot-models.sh.
  - model_name: github_copilot/claude-opus-4.6
    litellm_params:
      model: github_copilot/claude-opus-4.6
      input_cost_per_token: 0.000005 # $5.00 / 1M
      output_cost_per_token: 0.000025 # $25.00 / 1M
      cache_read_input_token_cost: 0.0000005 # $0.50 / 1M
      cache_creation_input_token_cost: 0.00000625 # $6.25 / 1M (cache write)
    model_info:
      max_input_tokens: 264000
      max_output_tokens: 64000
  - model_name: github_copilot/claude-opus-4.7
    litellm_params:
      model: github_copilot/claude-opus-4.7
      input_cost_per_token: 0.000005 # $5.00 / 1M
      output_cost_per_token: 0.000025 # $25.00 / 1M
      cache_read_input_token_cost: 0.0000005 # $0.50 / 1M
      cache_creation_input_token_cost: 0.00000625 # $6.25 / 1M (cache write)
    model_info:
      max_input_tokens: 264000
      max_output_tokens: 64000
  - model_name: github_copilot/claude-opus-4.8
    litellm_params:
      model: github_copilot/claude-opus-4.8
      input_cost_per_token: 0.000005 # $5.00 / 1M
      output_cost_per_token: 0.000025 # $25.00 / 1M
      cache_read_input_token_cost: 0.0000005 # $0.50 / 1M
      cache_creation_input_token_cost: 0.00000625 # $6.25 / 1M (cache write)
    model_info:
      max_input_tokens: 264000
      max_output_tokens: 64000
  - model_name: github_copilot/claude-sonnet-4.6
    litellm_params:
      model: github_copilot/claude-sonnet-4.6
      input_cost_per_token: 0.000003 # $3.00 / 1M
      output_cost_per_token: 0.000015 # $15.00 / 1M
      cache_read_input_token_cost: 0.0000003 # $0.30 / 1M
      cache_creation_input_token_cost: 0.00000375 # $3.75 / 1M (cache write)
    model_info:
      max_input_tokens: 264000
      max_output_tokens: 64000
  - model_name: github_copilot/claude-haiku-4.5
    litellm_params:
      model: github_copilot/claude-haiku-4.5
      input_cost_per_token: 0.000001 # $1.00 / 1M
      output_cost_per_token: 0.000005 # $5.00 / 1M
      cache_read_input_token_cost: 0.0000001 # $0.10 / 1M
      cache_creation_input_token_cost: 0.00000125 # $1.25 / 1M (cache write)
    model_info:
      max_input_tokens: 200000
      max_output_tokens: 64000
  - model_name: github_copilot/gpt-5.5
    litellm_params:
      model: github_copilot/gpt-5.5
      input_cost_per_token: 0.000005 # $5.00 / 1M (Default tier)
      output_cost_per_token: 0.00003 # $30.00 / 1M
      cache_read_input_token_cost: 0.0000005 # $0.50 / 1M
    model_info:
      max_input_tokens: 400000
      max_output_tokens: 128000
  - model_name: github_copilot/gpt-5.4
    litellm_params:
      model: github_copilot/gpt-5.4
      input_cost_per_token: 0.0000025 # $2.50 / 1M (Default tier)
      output_cost_per_token: 0.000015 # $15.00 / 1M
      cache_read_input_token_cost: 0.00000025 # $0.25 / 1M
    model_info:
      max_input_tokens: 400000
      max_output_tokens: 128000
  - model_name: github_copilot/gpt-5.3-codex
    litellm_params:
      model: github_copilot/gpt-5.3-codex
      input_cost_per_token: 0.00000175 # $1.75 / 1M
      output_cost_per_token: 0.000014 # $14.00 / 1M
      cache_read_input_token_cost: 0.000000175 # $0.175 / 1M
    model_info:
      max_input_tokens: 400000
      max_output_tokens: 128000
  # Legacy/base models below have no published per-token rates on GitHub's
  # pricing page (included models) — litellm records $0 spend for them.
  - model_name: github_copilot/gpt-4.1
    litellm_params:
      model: github_copilot/gpt-4.1
    model_info:
      max_input_tokens: 128000
      max_output_tokens: 16384
  - model_name: github_copilot/gpt-4o
    litellm_params:
      model: github_copilot/gpt-4o
    model_info:
      max_input_tokens: 128000
      max_output_tokens: 4096
  - model_name: github_copilot/gpt-4o-mini
    litellm_params:
      model: github_copilot/gpt-4o-mini
    model_info:
      max_input_tokens: 128000
      max_output_tokens: 4096

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Postgres: enables persistent virtual keys, budgets, and spend tracking.
  database_url: os.environ/DATABASE_URL
  # litellm runs `prisma db push` on boot to keep the schema current (the same
  # command setup-litellm-proxy.sh uses). To skip it and manage the schema only
  # via the setup script, set: disable_prisma_schema_update: true
  # disable_prisma_schema_update: true

litellm_settings:
  drop_params: true
  # Redis: distributed spend / TPM / RPM counters (needed when running >1 worker)
  # and powers the budget windows. Also enables exact-match response caching;
  # tune with cache_params.ttl or restrict cache_params.supported_call_types.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
